# Guest PWA — Netlify site settings can mirror this if UI overrides are cleared.
[build]
  command = "npm run build -w @hospitalityos/shared && npm run build -w @hospitalityos/guest-pwa"
  publish = "apps/guest-pwa/dist"

[build.environment]
  NODE_VERSION = "20"
  # Required for a working guest app: set in Netlify UI to your live API origin, e.g.
  # VITE_HOS_API_URL = https://your-api.example.com
  # Also set that API's CORS_ORIGINS to include this Netlify site URL, and ALLOW_DEMO_GUEST=true.

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
